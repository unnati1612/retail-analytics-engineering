version: 2

models:

  - name: int_orders_enriched
    description: >
      Order-level intermediate model combining orders, customers,
      order items, and payments. The grain is one row per order.

    columns:

      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null

      - name: purchased_at
        description: "Timestamp when the order was placed."
        data_tests:
          - not_null

      - name: item_count
        description: "Number of items included in the order."

      - name: item_value
        description: "Total value of products included in the order."

      - name: freight_value
        description: "Total freight value associated with the order."

      - name: payment_value
        description: "Total payment value associated with the order."

      - name: delivery_days
        description: "Number of days between purchase and customer delivery."

      - name: estimated_delivery_days
        description: >
          Number of days between purchase and the estimated delivery date.
          
      - name: delivered_late
        description: >
          Indicates whether the order was delivered after the estimated
          delivery date. NULL when the required delivery dates are unavailable.

  - name: int_customer_orders
    description: >
      Customer-order level intermediate model derived from int_orders_enriched.
      The grain is one row per customer order.

    columns:

      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Unique customer identifier across orders."
        data_tests:
          - not_null

      - name: customer_id
        description: "Order-level customer identifier."
        data_tests:
          - not_null

      - name: purchased_at
        description: "Timestamp when the order was placed."
        data_tests:
          - not_null

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - not_null

  - name: int_product_sales
    description: >
      Product-level intermediate model aggregating order item activity.
      The grain is one row per product.

    columns:

      - name: product_id
        description: "Unique identifier for a product."
        data_tests:
          - not_null
          - unique

      - name: units_sold
        description: "Total number of item units sold for the product."
        data_tests:
          - not_null

      - name: order_count
        description: "Number of distinct orders containing the product."
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total item revenue generated by the product."
        data_tests:
          - not_null

      - name: total_freight
        description: "Total freight value associated with the product."

      - name: average_item_price
        description: "Average selling price per item."

  - name: int_seller_performance
    description: >
      Seller-level performance model combining sales, delivery,
      and review metrics. The grain is one row per seller.

    columns:

      - name: seller_id
        description: "Unique identifier for a seller."
        data_tests:
          - not_null
          - unique

      - name: units_sold
        description: "Total number of items sold by the seller."
        data_tests:
          - not_null

      - name: order_count
        description: "Number of distinct orders containing seller items."
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total product revenue generated by the seller."
        data_tests:
          - not_null

      - name: total_freight
        description: "Total freight value associated with seller items."

      - name: average_delivery_days
        description: "Average number of days taken to deliver seller orders."

      - name: late_orders
        description: "Number of seller orders delivered after the estimated date."

      - name: average_review_score
        description: "Average customer review score associated with the seller."

      - name: review_count
        description: "Number of reviews associated with the seller."