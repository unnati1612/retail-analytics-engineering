version: 2

sources:
  - name: retail_raw
    database: retail-analytics-engineering
    schema: retail_raw
    description: "Raw Olist e-commerce data loaded into BigQuery."

    tables:
      - name: customers
        description: "Raw customer-level data."

      - name: orders
        description: "Raw order-level data."

      - name: order_items
        description: "Raw order item-level data."

      - name: products
        description: "Raw product-level data."

      - name: payments
        description: "Raw payment-level data."

      - name: reviews
        description: "Raw customer review data."

      - name: sellers
        description: "Raw seller-level data."

      - name: geolocation
        description: "Raw Brazilian zip-code geolocation data."
      
      - name: _ingest_customers
        description: "Append-only API ingestion batches for customers."

      - name: _ingest_products
        description: "Append-only API ingestion batches for products."

      - name: _ingest_sellers
        description: "Append-only API ingestion batches for sellers."

      - name: _ingest_orders
        description: "Append-only API ingestion batches for orders."

      - name: _ingest_order_items
        description: "Append-only API ingestion batches for order items."

      - name: _ingest_payments
        description: "Append-only API ingestion batches for payments."

      - name: _ingest_reviews
        description: "Append-only API ingestion batches for reviews."
      
      - name: ingestion_audit
        description: "Immutable audit records generated by the incremental ingestion pipeline."
        columns:
          - name: batch_id
            description: "Unique identifier for an ingestion batch."
          - name: entity
            description: "Entity processed during the ingestion batch."
          - name: started_at
            description: "UTC timestamp when ingestion for the entity started."
          - name: completed_at
            description: "UTC timestamp when ingestion for the entity completed."
          - name: records_fetched
            description: "Number of records fetched from the source API."
          - name: records_loaded
            description: "Number of records appended to the BigQuery ingestion table."
          - name: watermark_before
            description: "Watermark used to start the incremental extraction."
          - name: watermark_after
            description: "Watermark after successful ingestion."
          - name: status
            description: "Ingestion status."
          - name: error_message
            description: "Error details when ingestion fails."
