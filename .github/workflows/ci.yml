name: Retail Analytics CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  quality-checks:
    name: Python and dbt checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall \
            ingestion \
            source_api

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: retail-analytics-engineering
          workload_identity_provider: "projects/356427557562/locations/global/workloadIdentityPools/github/providers/retail-analytics"
          service_account: github-ci@retail-analytics-engineering.iam.gserviceaccount.com

      - name: Run dbt tests
        working-directory: dbt/retail_analytics
        run: |
          dbt test \
            --profiles-dir ../../.github/dbt