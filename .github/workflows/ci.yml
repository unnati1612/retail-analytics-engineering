name: Retail Analytics CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

jobs:
  quality-checks:
    name: Python and dbt checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall \
            ingestion \
            source_api

      - name: Validate dbt project
        working-directory: dbt/retail_analytics
        run: |
          dbt parse \
            --profiles-dir ../../airflow/config/dbt